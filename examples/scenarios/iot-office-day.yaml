# A full office day per minute (time_scale 1440): occupancy, heat and CO2 peak at midday, thermostats respond.
# Run it: vibesim run examples/scenarios/iot-office-day.yaml
domain: iot
time_scale: 1440.0
start_time: '2026-01-05T08:00:00Z'
entities:
- id: room
  type: room
  count: 6
  initial_state:
    setpoint_c: 21.0
    temp_c: 21.0
    co2_ppm: 420.0
    status: idle
  fields:
    occupancy:
      min: 0.0
      round: 0
      behavior: cycle
      base: 8.0
      amplitude: 12.0
      period_s: 86400.0
      phase_s: -21600.0
    outdoor_c:
      round: 2
      behavior: cycle
      base: 28.0
      amplitude: 6.0
      period_s: 86400.0
      phase_s: -28800.0
    temp_c:
      noise: 0.01
      round: 2
      behavior: derived
      expr: temp_c + dt * (0.002 * (outdoor_c - temp_c) + 0.0005 * occupancy - (0.01 if status == 'cooling' else 0) + (0.01
        if status == 'heating' else 0))
    humidity_pct:
      min: 0.0
      max: 100.0
      noise: 0.5
      round: 1
      behavior: mean_revert
      target: 45.0
    co2_ppm:
      min: 400.0
      round: 0
      behavior: derived
      expr: co2_ppm + dt * (occupancy * 0.5 - (co2_ppm - 420) * 0.002)
    power_kw:
      round: 2
      behavior: derived
      expr: 0.5 + (3.0 if status != 'idle' else 0) + occupancy * 0.05
  machine:
  - source: idle
    target: cooling
    when: temp_c > setpoint_c + 1
  - source: idle
    target: heating
    when: temp_c < setpoint_c - 1
  - source: cooling
    target: idle
    when: temp_c <= setpoint_c
  - source: heating
    target: idle
    when: temp_c >= setpoint_c
