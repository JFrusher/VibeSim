[project]
name = "vibesim"
version = "0.1.0"
description = "Promptable local-first micro-emulator that streams stateful simulated telemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
dev = ["anthropic>=2.3", "types-PyYAML", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vibesim*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["vibesim"]
