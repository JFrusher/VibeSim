[project]
name = "vibesim"
version = "0.1.0"
description = "Promptable local-first micro-emulator that streams stateful simulated telemetry."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.core", "src.domains", "src.transport", "src.chaos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
