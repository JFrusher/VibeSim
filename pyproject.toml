[project]
name = "vibesim"
version = "1.0.0"
description = "Promptable local-first micro-emulator that streams stateful simulated telemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jacob Frusher" }]
keywords = ["simulation", "mock data", "telemetry", "emulator", "sse", "websocket", "mqtt", "testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/JFrusher/VibeSim"
Documentation = "https://jfrusher.github.io/VibeSim/"
Changelog = "https://github.com/JFrusher/VibeSim/blob/main/CHANGELOG.md"

[project.optional-dependencies]
claude = ["anthropic>=2.3"]
mqtt = ["paho-mqtt>=2.1"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = [
    "anthropic>=2.3",
    "paho-mqtt>=2.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "amqtt>=0.12",
    "types-PyYAML",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
vibesim = "vibesim.cli:main"

[project.entry-points.pytest11]
vibesim = "vibesim.testing"

[tool.setuptools.packages.find]
include = ["vibesim*"]

[tool.setuptools.package-data]
vibesim = ["static/*", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/pytest"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["vibesim"]
